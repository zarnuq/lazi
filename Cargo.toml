[workspace]
members = ["crates/*"]
resolver = "3"

# Shared so files and lazi can't drift onto two versions of the same crate.
[workspace.dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ron = { version = "0.12.2", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
